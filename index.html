<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abet3 - Autonomous Agent Chat</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-green: #2ea043;
            --accent-glow: rgba(46, 160, 67, 0.4);
            --user-bubble: #1f6feb;
            --agent-bubble: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span {
            color: var(--accent-green);
        }

        .status-badge {
            background: rgba(46, 160, 67, 0.15);
            color: #56d364;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--user-bubble);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.agent {
            background-color: var(--agent-bubble);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.agent pre {
            background: #090d16;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
            border: 1px solid var(--border-color);
        }

        .message.agent code {
            font-family: 'Courier New', Courier, monospace;
            color: #79c0ff;
        }

        .input-area {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            height: 50px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--user-bubble);
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
        }

        button {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #2c974b;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Abet3 <span>Agent</span></h1>
        <div class="status-badge">● Online (Autonomous Mode)</div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message agent">
            Fala, chefe! 👾 Estou pronto para quebrar a cabeça, resolver problemas e rodar comandos para você. O que vamos construir ou consertar hoje?
        </div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Digite o objetivo ou comando para o Abet3..." rows="1" autofocus></textarea>
        <button id="sendBtn" onclick="sendMessage()">Executar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            userInput.value = '';
            setTimeout(() => {
                simulateAgentWorkflow(text);
            }, 600);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (sender === 'agent' && text.includes('```')) {
                msgDiv.innerHTML = formatMarkdown(text);
            } else {
                msgDiv.textContent = text;
            }
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function simulateAgentWorkflow(goal) {
            const thinkingId = 'thinking-' + Date.now();
            const thinkDiv = document.createElement('div');
            thinkDiv.className = 'message agent';
            thinkDiv.id = thinkingId;
            thinkDiv.innerHTML = `🧠 Analisando objetivo: <em>"${goal}"</em>... planejando passos e ações no terminal.`;
            chatContainer.appendChild(thinkDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                const el = document.getElementById(thinkingId);
                if (el) {
                    el.innerHTML = `✅ <strong>Ciclo concluído com sucesso!</strong><br>O agente executou os comandos, validou a saída e resolveu o problema.<br><pre><code>$ python agent.py --run --goal="${goal}"\n> Status: 100% OK [Exit Code 0]</code></pre>`;
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1800);
        }

        function formatMarkdown(content) {
            return content.replace(/```([a-z]*)
([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
        }
    </script>
</body>
</html>
